<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | DJO GSM</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="wrap"><header><a href="/" class="brand">DJO <b>GSM</b></a><span>ESPACE ADMINISTRATION</span></header>
<section id="loginBox" class="panel"><h1>Connexion Admin</h1><p>Connectez-vous avec le compte administrateur DJO GSM.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button>Se connecter</button><p id="loginMsg" class="msg"></p></form></section>
<section id="adminBox" class="panel" hidden><div class="bar"><div><h1>Gestion des produits</h1><p>Ajouter, modifier ou supprimer les produits du catalogue.</p></div><button id="logout" class="secondary">Déconnexion</button></div>
<form id="productForm" class="productForm"><input id="productId" type="hidden"><label>Nom du produit<input id="name" required></label><label>Catégorie<select id="category"><option value="accessoires">Accessoires téléphone</option><option value="recepteurs">Récepteurs</option><option value="streaming">Streaming</option><option value="orange">Services Orange</option></select></label><label>Prix (DT)<input id="price" type="number" min="0" step="0.01" required></label><label>Description<textarea id="description" rows="2"></textarea></label><label>Photo du produit<input id="image" type="file" accept="image/*"></label><div id="preview"></div><div class="actions"><button id="saveBtn">Enregistrer le produit</button><button type="button" id="cancel" class="secondary">Annuler</button></div><p id="formMsg" class="msg"></p></form>
<h2>Catalogue en ligne</h2><div id="items" class="items"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
